# 全タスクの入口。
#
# install.sh は mise が無い状態から走るのでここには載らない。
# ここに載るのは mise が使えるようになった後のタスクだけ。
#
# fish は mise の registry に無く aqua backend 経由になるため、Homebrew と比べてから決める。

[tools]
bun = "1"
# agent-browser は AI が Web ページを調査するためのブラウザ CLI。
# npm backend の導入には node が要らないが、実行には要るので node もここで管理する。
node = "lts"
"npm:agent-browser" = "0.34"

[tasks.setup]
description = "リポジトリが管理するツールと設定を PC に適用する"
# agent-browser install は Chrome for Testing を ~/.agent-browser/browsers へ置く。導入済みなら何もしない。
run = ["mise install", "agent-browser install", "bun bin/symlink.ts"]

[tasks.git-setup]
description = "このリポジトリに commit / push できる状態にする(任意)"
run = "bun bin/git-setup.ts"

[tasks.check]
description = "TypeScript と Markdown を format / lint / type check で検証する"
run = ["bun install --frozen-lockfile", "bun run check"]

[tasks.docs]
description = "Bun 公式ドキュメントの目次を取り直す"
run = "curl -fsSL https://bun.com/llms.txt -o docs/bun-llms.txt"
