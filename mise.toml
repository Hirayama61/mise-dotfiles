# このリポジトリで管理するツール・設定の宣言と、全タスクの入口。
# mise run setup(mise bootstrap)が宣言どおりに PC を揃え、済んでいる項目は飛ばす。
#
# install.sh は mise が無い状態から走るのでここには載らない。
# ここに載るのは mise が使えるようになった後のタスクだけ。

[tools]
bun = "1"
# agent-browser は AI が Web ページを調査するためのブラウザ CLI。
# npm backend の導入には node が要らないが、実行には要るので node もここで管理する。
node = "lts"
"npm:agent-browser" = "0.34"

# Panda 配色。単一ソースは bin/lib/palette.sh で、ここはテンプレート(config/**)が読む写し。
# 一致は config/palette.test.ts が検査する。
[vars]
panda_bg = "#242526"
panda_bg_dim = "#292a2b"
panda_fg = "#e6e6e6"
panda_white = "#ffffff"
panda_selection = "#3e4250"
panda_subtle = "#676b79"
panda_pink = "#ff75b5"
panda_mint = "#19f9d8"
panda_orange = "#ffb86c"
panda_red = "#ff4b82"
panda_blue = "#45a9f9"
panda_cyan = "#6fc1ff"
panda_blue_lift = "#95d0ff"
panda_purple_lift = "#cdbfff"
panda_gray_lift = "#a4a8b8"

# Homebrew の formula は "brew:", cask は "brew-cask:" で宣言する。
# mise が bottle と cask を直接置くので、Homebrew CLI は要らない。
[bootstrap.packages]
# fish は mise の registry に無く aqua 経由になる。ログインシェルは /etc/shells に固定パスで
# 登録する必要があり、mise の導入先はバージョンごとに変わるため Homebrew で入れる。
"brew:fish" = "latest"
"brew:tig" = "latest" # git TUI。mise の registry に無い
"brew-cask:ghostty" = { os = "macos" }
"brew-cask:raycast" = { os = "macos" }
# 手動で入れた Chrome を置き換えず取り込む。自己更新するアプリなので内容の照合なしで引き継がれる。
"brew-cask:google-chrome" = { os = "macos", adopt = true }
"brew-cask:font-jetbrains-mono-nerd-font" = "latest" # Ghostty のフォント

[dotfiles]
"~/.claude/rules" = "claude/rules"
# hooks の本体。settings.json への登録は bootstrap タスクの bin/claude-settings.ts が行う。
"~/.claude/hooks" = "claude/hooks"
# Haiku 固定の役割限定 subagent。同名の定義がプロジェクトの .claude/agents にあればそちらが優先される。
"~/.claude/agents" = "claude/agents"
# personal skill。~/.claude/skills には Claude Code が synced/ を作るのでディレクトリごとは symlink にせず、
# symlink-each で各ファイルを ~/.claude/skills/<skill>/ 配下へ個別に symlink する。
"~/.claude/skills" = { source = "claude/skills", mode = "symlink-each", exclude = ["*.test.ts"] }
# ステータスラインの描画スクリプト。settings.json の statusLine は bin/claude-settings.ts が登録する。
"~/.claude/statusline" = "claude/statusline"
# fish の設定。config.fish は入口だけで、中身は conf.d/ に役割ごとに分ける。
# conf.d には fish の拡張機能もファイルを置くので、ディレクトリごとは symlink にせず symlink-each にする。
"~/.config/fish/config.fish" = "config/fish/config.fish"
"~/.config/fish/conf.d" = { source = "config/fish/conf.d", mode = "symlink-each" }

# ツール設定。ディレクトリごと symlink できるものはそのまま、配色が要るものだけ Tera で描画する。
# ~/.gitconfig は端末ローカルの書き先(git config --global)として残し、共有設定の include だけを管理する。
"~/.gitconfig/include" = { block = "[include]\n    path = ~/.config/git/config", comment = "#" }
"~/.config/git/config" = { source = "config/git/config", mode = "template" }
"~/.config/git/ignore" = "config/git/ignore"
"~/.config/git/hooks" = "config/git/hooks"
"~/.config/tmux/tmux.conf" = { source = "config/tmux/tmux.conf", mode = "template" }
"~/.config/tmux/cheatsheet.sh" = "config/tmux/cheatsheet.sh"
"~/.config/tmux/jump.zsh" = "config/tmux/jump.zsh"
"~/.config/tmux/split-even.sh" = "config/tmux/split-even.sh"
"~/.config/nvim" = "config/nvim"
"~/.config/ghostty" = "config/ghostty"
"~/.config/starship.toml" = { source = "config/starship.toml", mode = "template" }
"~/.config/tig/config" = "config/tig/config"
"~/.config/gwq/config.toml" = "config/gwq/config.toml"
"~/.config/mise/config.toml" = "config/mise/config.toml"

# ログインシェルを fish にする。/etc/shells への登録(初回は sudo)と chsh を mise が行う。
# zsh の設定は管理しない。zsh の startup file にも書かない。
[bootstrap.user]
login_shell = "fish"

# macOS の設定。旧 bin/macos-defaults.sh の宣言化。Finder / Dock は再起動後に反映される。
[bootstrap.macos.dock]
autohide = true
# 既存値は実数なので 0.0 と書く。time_modifier は float32 で保存され 0.2 だと毎回 differs になるため、正確に表せる 0.25 にする。
autohide_delay = 0.0
autohide_time_modifier = 0.25
show_recents = false
tilesize = 48

[bootstrap.macos.finder]
show_all_files = true
show_pathbar = true
show_status_bar = true
show_extensions_warning = false
sort_folders_first = true

[bootstrap.macos.keyboard]
key_repeat = 2
initial_key_repeat = 15
press_and_hold = false
automatic_spelling_correction = false

[bootstrap.macos.trackpad]
tap_to_click = true

[bootstrap.macos.defaults]
NSGlobalDomain = { AppleShowAllExtensions = true, AppleInterfaceStyle = "Dark", NSAutomaticDashSubstitutionEnabled = false, NSAutomaticQuoteSubstitutionEnabled = false, AppleEnableDocumentInputSourceSync = true }
"com.apple.finder" = { FXDefaultSearchScope = "SCcf" }
"com.apple.dock" = { mineffect = "scale" }
"com.apple.menuextra.clock" = { ShowSeconds = true }
"com.apple.desktopservices" = { DSDontWriteNetworkStores = true, DSDontWriteUSBStores = true }

# -currentHost のタップ設定
[[bootstrap.macos.defaults_entries]]
domain = "NSGlobalDomain"
key = "com.apple.mouse.tapBehavior"
value = 1
host = "current"

# Spotlight のショートカットを無効にして Cmd+Space を Raycast に譲る(64 = 検索、65 = Finder 検索)。
[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["64"]
value = { enabled = false }

[[bootstrap.macos.defaults_entries]]
domain = "com.apple.symbolichotkeys"
key = "AppleSymbolicHotKeys"
path = ["65"]
value = { enabled = false }

[tasks.setup]
description = "リポジトリが管理するツールと設定を PC に適用する"
# タスクの PATH に mise 自身は無いので、テンプレートで絶対パスを引く。
# --yes が飛ばすのは確認プロンプトだけ。配置先に実体がある dotfile は上書きせず止まる。
run = "{{ mise_bin }} bootstrap --yes"

# mise bootstrap が [tools] を入れた後に呼ぶ。宣言で書けない手続きだけを置く。
[tasks.bootstrap]
hide = true
run = [
  # Chrome for Testing を ~/.agent-browser/browsers へ置く。導入済みなら何もしない。
  "agent-browser install",
  # ~/.claude/settings.json は Claude Code 自身が書くので symlink にせず、管理キーだけをマージする。
  "bun bin/claude-settings.ts",
]

[tasks.git-setup]
description = "このリポジトリに commit / push できる状態にする(任意)"
# タスクの PATH に mise 自身は無いので、gh の導入に使う mise の絶対パスを渡す。
env = { MISE_BIN = "{{ mise_bin }}" }
run = "bun bin/git-setup.ts"

[tasks.check]
description = "TypeScript と Markdown を format / lint / type check / デッドコード検査 / test で検証する"
run = ["bun install --frozen-lockfile", "bun run check", "bun test"]

[tasks."macos:startup-mute"]
description = "起動音を OFF にする(nvram、sudo が要る。新端末で 1 回)"
run = "sudo nvram StartupMute=%01"

[tasks.docs]
description = "Bun 公式ドキュメントの目次を取り直す"
run = "curl -fsSL https://bun.com/llms.txt -o docs/bun-llms.txt"
