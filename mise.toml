# このリポジトリで管理するツール・設定の宣言と、全タスクの入口。
# mise run setup(mise bootstrap)が宣言どおりに PC を揃え、済んでいる項目は飛ばす。
#
# install.sh は mise が無い状態から走るのでここには載らない。
# ここに載るのは mise が使えるようになった後のタスクだけ。

[tools]
bun = "1"
# agent-browser は AI が Web ページを調査するためのブラウザ CLI。
# npm backend の導入には node が要らないが、実行には要るので node もここで管理する。
node = "lts"
"npm:agent-browser" = "0.34"

# Homebrew の formula が要るときは "brew:<formula>" = "latest" をここに書く。
# mise が bottle を /opt/homebrew へ直接置くので、Homebrew CLI は要らない。
[bootstrap.packages]

[dotfiles]
"~/.claude/rules" = "claude/rules"
# mise は ~/.local/bin に入るが、素の macOS ではそこが PATH に無い。
# 下の shell activation が書く eval "$(mise activate zsh)" は裸の mise を呼ぶので、
# 同じ ~/.zprofile の先頭側で PATH へ通す。dotfiles は shell activation より先に適用される。
"~/.zprofile/local-bin" = { block = 'export PATH="$HOME/.local/bin:$PATH"' }

# ~/.zprofile に shims、~/.zshrc に activate を書く。
[bootstrap.mise_shell_activate]
zsh = true

[tasks.setup]
description = "リポジトリが管理するツールと設定を PC に適用する"
# タスクの PATH に mise 自身は無いので、テンプレートで絶対パスを引く。
# --yes が飛ばすのは確認プロンプトだけ。配置先に実体がある dotfile は上書きせず止まる。
run = "{{ mise_bin }} bootstrap --yes"

# mise bootstrap が [tools] を入れた後に呼ぶ。宣言で書けない手続きだけを置く。
[tasks.bootstrap]
hide = true
# agent-browser install は Chrome for Testing を ~/.agent-browser/browsers へ置く。導入済みなら何もしない。
run = "agent-browser install"

[tasks.git-setup]
description = "このリポジトリに commit / push できる状態にする(任意)"
# タスクの PATH に mise 自身は無いので、gh の導入に使う mise の絶対パスを渡す。
env = { MISE_BIN = "{{ mise_bin }}" }
run = "bun bin/git-setup.ts"

[tasks.check]
description = "TypeScript と Markdown を format / lint / type check で検証する"
run = ["bun install --frozen-lockfile", "bun run check"]

[tasks.docs]
description = "Bun 公式ドキュメントの目次を取り直す"
run = "curl -fsSL https://bun.com/llms.txt -o docs/bun-llms.txt"
